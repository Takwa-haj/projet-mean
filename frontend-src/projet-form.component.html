<!-- src/app/pages/projet-form/projet-form.component.html -->
<div class="page-container page-narrow">

  <div class="page-header">
    <a routerLink="/projets" class="btn-back">← Retour</a>
    <h1 class="page-title">{{ isEditMode ? 'Modifier le projet' : 'Nouveau projet' }}</h1>
  </div>

  <div class="loading-state" *ngIf="isLoading && isEditMode">
    <div class="spinner"></div><p>Chargement...</p>
  </div>

  <div class="success-alert" *ngIf="successMessage">✅ {{ successMessage }}</div>
  <div class="error-alert" *ngIf="errorMessage">⚠️ {{ errorMessage }}</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card" *ngIf="!isLoading || !isEditMode">

    <!-- Nom -->
    <div class="form-group">
      <label class="form-label">Nom du projet <span class="required">*</span></label>
      <input
        type="text"
        class="form-input"
        [class.input-error]="nomCtrl.invalid && nomCtrl.touched"
        formControlName="nom"
        placeholder="Ex : Site e-commerce, Application mobile..."
      />
      <div class="error-msg" *ngIf="nomCtrl.invalid && nomCtrl.touched">
        <span *ngIf="nomCtrl.errors?.['required']">Le nom est obligatoire</span>
        <span *ngIf="nomCtrl.errors?.['minlength']">Minimum 3 caractères</span>
        <span *ngIf="nomCtrl.errors?.['maxlength']">Maximum 100 caractères</span>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea
        class="form-input form-textarea"
        [class.input-error]="descCtrl.invalid && descCtrl.touched"
        formControlName="description"
        placeholder="Décrivez l'objectif du projet..."
        rows="3"
      ></textarea>
      <div class="error-msg" *ngIf="descCtrl.invalid && descCtrl.touched">
        <span *ngIf="descCtrl.errors?.['maxlength']">Maximum 500 caractères</span>
      </div>
    </div>

    <!-- Dates -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date de début</label>
        <input type="date" class="form-input" formControlName="dateDebut" />
      </div>
      <div class="form-group">
        <label class="form-label">Date de fin prévue</label>
        <input type="date" class="form-input" formControlName="dateFin" />
      </div>
    </div>

    <!-- Statut -->
    <div class="form-group">
      <label class="form-label">Statut</label>
      <select class="form-input form-select" formControlName="statut">
        <option value="actif">Actif</option>
        <option value="en_pause">En pause</option>
        <option value="terminé">Terminé</option>
        <option value="annulé">Annulé</option>
      </select>
    </div>

    <!-- Couleur -->
    <div class="form-group">
      <label class="form-label">Couleur d'identification</label>
      <div class="color-picker">
        <button
          type="button"
          *ngFor="let c of couleurs"
          class="color-swatch"
          [style.background]="c"
          [class.selected]="form.get('couleur')?.value === c"
          (click)="form.get('couleur')?.setValue(c)"
        ></button>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a routerLink="/projets" class="btn btn-outline">Annuler</a>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading">Enregistrement...</span>
        <span *ngIf="!isLoading">{{ isEditMode ? 'Enregistrer les modifications' : 'Créer le projet' }}</span>
      </button>
    </div>

  </form>
</div>
